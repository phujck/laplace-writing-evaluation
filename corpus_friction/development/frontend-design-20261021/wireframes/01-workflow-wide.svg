<text x="32" y="674" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700">1</text>
<text x="62" y="669" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">Graph grouping is presentation. Typed relations determine containment, dependencies, reviewer roles and permitted effects.</text>
<rect x="20" y="717" width="1240" height="58" rx="7" fill="#edf4fc" stroke="#c2cbd3"/>
<text x="32" y="744" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700">2</text>
<text x="62" y="739" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">The run stays on v4. Save changes v5 for future runs; an active version changes only through an explicit owner-supported boundary.</text>
