<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1110" viewBox="0 0 430 1110" role="img"><title>Workflow on a narrow screen</title><desc>Proposed narrow outline-first workflow editor, with step controls, effective settings and preserved conversation return.</desc><rect width="100%" height="100%" fill="#f5f7f9"/>
<text x="20" y="25" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700">DESIGN PROPOSAL · STATIC · SYNTHETIC EXAMPLE</text>
<text x="20" y="61" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700">Workflow on a narrow screen</text>
<rect x="16" y="81" width="398" height="55" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="28" y="107" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Example note / Workflow / Draft</text>
<rect x="16" y="148" width="192" height="42" rx="7" fill="#225c9c" stroke="#225c9c"/>
<text x="28" y="172" fill="#ffffff" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Plan · v5 draft</text>
<rect x="222" y="148" width="192" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="234" y="172" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Run · using v4</text>
<rect x="16" y="204" width="398" height="405" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="28" y="230" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Workflow · nested outline</text>
<rect x="29" y="246" width="372" height="43" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="41" y="272" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Idea</text>
<rect x="29" y="297" width="372" height="43" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="41" y="323" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Sources</text>
<rect x="29" y="348" width="372" height="43" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="41" y="374" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Plan</text>
<rect x="29" y="399" width="372" height="43" rx="7" fill="#edf4fc" stroke="#c2cbd3"/>
<text x="41" y="425" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Draft · selected</text>
<rect x="29" y="450" width="372" height="43" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="41" y="476" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Review ▸ 2 roles</text>
<rect x="29" y="501" width="372" height="43" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="41" y="527" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">PDF</text>
<rect x="29" y="559" width="114" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="41" y="583" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Add step</text>
<rect x="151" y="559" width="116" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="163" y="583" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Connect</text>
<rect x="275" y="559" width="126" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="287" y="583" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Move / nest</text>
<rect x="16" y="624" width="398" height="243" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="28" y="650" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Draft / Writer</text>
<text x="30" y="679" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Advance automatically. Apply source changes</text>
<text x="30" y="700" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">after independent review.</text>
<text x="30" y="755" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Project instruction v3 → Role override v5</text>
<rect x="30" y="782" width="180" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="42" y="806" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Effective settings</text>
<rect x="222" y="782" width="178" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="234" y="806" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Edit roles</text>
<rect x="16" y="880" width="398" height="42" rx="7" fill="#225c9c" stroke="#225c9c"/>
<text x="28" y="904" fill="#ffffff" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Save v5 for future runs</text>
<rect x="16" y="935" width="398" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="28" y="959" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Conversation · Draft (draft kept)</text>
<text x="20" y="1017" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">Equivalent keyboard/list operations; one main</text>
<text x="20" y="1037" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">surface at a time. Return preserves selection,</text>
<text x="20" y="1057" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">scroll and unsent text.</text>
</svg>
