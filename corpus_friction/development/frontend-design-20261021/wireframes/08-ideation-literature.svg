<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1050" viewBox="0 0 1280 1050" role="img"><title>Explore an idea into a changed plan</title><desc>Synthetic proposed ideation, literature and synthesis workspace with a disconfirming-evidence feedback loop into the selected premise and reader plan.</desc><rect width="100%" height="100%" fill="#f5f7f9"/>
<text x="20" y="25" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700">DESIGN PROPOSAL · STATIC · SYNTHETIC EXAMPLE</text>
<text x="20" y="61" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700">Explore an idea into a changed plan</text>
<rect x="20" y="82" width="1240" height="54" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="32" y="108" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Example note / Question: why does the boundary change the result?</text>
<rect x="20" y="151" width="211" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="32" y="175" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Add competing idea</text>
<rect x="245" y="151" width="206" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="257" y="175" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Find / read sources</text>
<rect x="465" y="151" width="192" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="477" y="175" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Roles &amp; instructions</text>
<rect x="671" y="151" width="198" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="683" y="175" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Run policy &amp; limits</text>
<rect x="20" y="218" width="607" height="321" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="32" y="244" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Competing ideas</text>
<rect x="40" y="268" width="565" height="101" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="52" y="294" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Idea A · boundary changes the mechanism</text>
<text x="55" y="324" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Premise: the mechanism is different. Needs a source or result that</text>
<text x="55" y="345" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">distinguishes it.</text>
<rect x="40" y="391" width="565" height="100" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="52" y="417" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Idea B · the same mechanism changes scale</text>
<text x="55" y="446" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Premise: scale alone explains the effect. Compare against the same</text>
<text x="55" y="467" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">source.</text>
<rect x="647" y="218" width="613" height="321" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="659" y="244" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Literature · selected passage</text>
<text x="664" y="283" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">Paper P / passage 17: evidence distinguishes the mechanism and</text>
<text x="664" y="306" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">scale explanations.</text>
<text x="664" y="365" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">Passage read · source and location available</text>
<rect x="664" y="394" width="270" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="676" y="418" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Open source &amp; passage</text>
<rect x="949" y="394" width="291" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="961" y="418" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Bind to claim / idea</text>
<text x="664" y="476" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Reading is linked to these idea premises</text>
<rect x="20" y="562" width="607" height="180" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="32" y="588" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Synthesis · compare, then revise</text>
<text x="39" y="624" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">The passage weakens Idea A’s premise. Return that finding to A;</text>
<text x="39" y="647" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">retain B with its stated limits. Keep the unresolved question</text>
<text x="39" y="670" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">visible.</text>
<rect x="647" y="562" width="613" height="180" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="659" y="588" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Reader plan §2 → connected draft</text>
<text x="665" y="624" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">Add the missing boundary premise. Link the passage, comparison and</text>
<text x="665" y="647" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">claim. The draft consumes the changed plan.</text>
<path d="M327 539 L327 562" stroke="#225c9c" fill="none" stroke-width="2"/>
<polygon points="327,562 323.3,553.8 330.7,553.8" fill="#225c9c"/>
<path d="M950 539 L750 562" stroke="#225c9c" fill="none" stroke-width="2"/>
<polygon points="750,562 757.7,557.4 758.6,564.7" fill="#225c9c"/>
<path d="M627 652 L647 652" stroke="#225c9c" fill="none" stroke-width="2"/>
<polygon points="647,652 638.8,655.7 638.8,648.3" fill="#225c9c"/>
<path d="M50 705 L30 705" stroke="#225c9c" fill="none" stroke-width="2"/>
<polygon points="30,705 38.2,701.3 38.2,708.7" fill="#225c9c"/>
<path d="M30 705 L30 320" stroke="#225c9c" fill="none" stroke-width="2"/>
<polygon points="30,320 33.7,328.2 26.3,328.2" fill="#225c9c"/>
<path d="M30 320 L40 320" stroke="#225c9c" fill="none" stroke-width="2"/>
<polygon points="40,320 31.8,323.7 31.8,316.3" fill="#225c9c"/>
<text x="61" y="725" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700">Return to Idea A’s premise</text>
<rect x="20" y="766" width="1240" height="113" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="32" y="792" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Visible feedback route</text>
<text x="38" y="826" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">Passage → Synthesis → Idea A premise ↻    and    Synthesis → Reader plan §2 → Draft §2</text>
<text x="38" y="859" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">Other ideas and unrelated work remain available. Open any node, role, message or evidence link.</text>
<rect x="20" y="903" width="1240" height="58" rx="7" fill="#edf4fc" stroke="#c2cbd3"/>
<text x="32" y="930" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700">1</text>
<text x="62" y="925" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">The ideation, literature and synthesis roles can advance unattended under their configured scope. Conflicting material decisions reach the human only when</text>
<text x="62" y="945" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">the selected policy requires it.</text>
<rect x="20" y="973" width="1240" height="58" rx="7" fill="#edf4fc" stroke="#c2cbd3"/>
<text x="32" y="1000" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700">2</text>
<text x="62" y="995" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">This is a synthetic design journey. Existing closed science campaigns are not restarted; new controls must target real concept/literature/reader-plan owners</text>
<text x="62" y="1015" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">and explicit routing gaps.</text>
</svg>
