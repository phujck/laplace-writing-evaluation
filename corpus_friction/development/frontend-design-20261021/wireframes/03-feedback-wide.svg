<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img"><title>A comment during a running draft</title><desc>Proposed origin feedback and explicit bounded recipient routing, with independent acknowledgement and return states. All content is synthetic.</desc><rect width="100%" height="100%" fill="#f5f7f9"/>
<text x="20" y="25" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700">DESIGN PROPOSAL · STATIC · SYNTHETIC EXAMPLE</text>
<text x="20" y="61" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700">A comment during a running draft</text>
<rect x="20" y="82" width="1240" height="54" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="32" y="108" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Example note / Manuscript / Section 2 / Paragraph</text>
<rect x="1037" y="88" width="205" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="1049" y="112" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Back to Draft run</text>
<rect x="20" y="151" width="700" height="439" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="32" y="177" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Draft · section 2</text>
<text x="42" y="221" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">This explanation follows the result from its stated boundary</text>
<text x="42" y="246" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">conditions. The next paragraph connects the argument to the supporting</text>
<text x="42" y="271" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">evidence.</text>
<rect x="40" y="315" width="660" height="180" rx="7" fill="#edf4fc" stroke="#c2cbd3"/>
<text x="52" y="341" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Comment saved · routing automatically</text>
<text x="58" y="377" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400">Does this conclusion still follow if the boundary changes?</text>
<text x="58" y="451" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">Your comment is saved. Your draft is kept.</text>
<rect x="42" y="524" width="214" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="54" y="548" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Compare changed source</text>
<rect x="272" y="524" width="204" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="284" y="548" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Stop before next effect</text>
<rect x="736" y="151" width="524" height="439" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="748" y="177" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Routing · following workflow policy</text>
<rect x="752" y="205" width="491" height="76" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="764" y="231" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Section work</text>
<text x="765" y="255" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Acknowledged · reviewing this section</text>
<rect x="752" y="296" width="491" height="76" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="764" y="322" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Reader plan</text>
<text x="765" y="346" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Acknowledged · checking premises</text>
<rect x="752" y="387" width="491" height="76" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="764" y="413" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Supporting simulation</text>
<text x="765" y="437" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Retrying · boundary dependency</text>
<text x="754" y="503" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">Unrelated literature work stays available.</text>
<rect x="752" y="526" width="234" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="764" y="550" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Routing policy</text>
<rect x="998" y="526" width="245" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="1010" y="550" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Pause routing</text>
<rect x="20" y="608" width="1240" height="112" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="32" y="634" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">After delivery · one aggregate return</text>
<text x="40" y="665" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Section work: returned draft    Reader plan: acknowledged    Simulation: unavailable</text>
<text x="40" y="696" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">The section draft is retained. The unavailable recipient retries under its own configured limits.</text>
<rect x="20" y="741" width="1240" height="58" rx="7" fill="#edf4fc" stroke="#c2cbd3"/>
<text x="32" y="768" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700">1</text>
<text x="62" y="763" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">The workflow owner sets recipients, retry and cost limits. Automatic delivery follows the authorised policy; a manual preview remains available when chosen.</text>
<rect x="20" y="811" width="1240" height="58" rx="7" fill="#edf4fc" stroke="#c2cbd3"/>
<text x="32" y="838" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700">2</text>
<text x="62" y="833" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">Declared feedback cycles may continue unattended within their budgets. Origin/generation deduplication and local stop conditions prevent uncontrolled</text>
<text x="62" y="853" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">repeated delivery.</text>
</svg>
