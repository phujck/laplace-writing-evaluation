<text x="32" y="738" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Recent messages and effects · scoped to this region</text>
<text x="39" y="772" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">10:09  Writer → Reader: proposal v5 and declared task inputs</text>
<text x="39" y="807" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">10:10  Reader → Writer: missing premise in section 2; finding returned</text>
<text x="39" y="842" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">10:12  Writer → Proposal owner: v6 saved; source application still follows review</text>
<rect x="20" y="905" width="1240" height="58" rx="7" fill="#edf4fc" stroke="#c2cbd3"/>
<text x="32" y="932" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700">1</text>
<text x="62" y="927" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">Configured roles, observed actors, returned results and applied source effects are separate states. Open the inspector for exact</text>
<text x="62" y="947" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">session/turn/operation/receipt identities and evidence time.</text>
<rect x="20" y="975" width="1240" height="58" rx="7" fill="#edf4fc" stroke="#c2cbd3"/>
<text x="32" y="1002" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700">2</text>
<text x="62" y="997" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">A feedback cycle is allowed. Each generation consumes the configured budget; it stops locally on acceptance, limit, failure, cancellation or a chosen</text>
<text x="62" y="1017" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">human/material-decision boundary.</text>
</svg>
