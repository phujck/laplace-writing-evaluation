<polygon points="640,462 631.8,465.7 631.8,458.3" fill="#225c9c"/>
<text x="292" y="565" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Review / revise ↻ until the chosen acceptance or limit</text>
<text x="292" y="598" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">Limits: 2 of 4 review cycles used. The run continues within its chosen</text>
<text x="292" y="618" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">policy.</text>
