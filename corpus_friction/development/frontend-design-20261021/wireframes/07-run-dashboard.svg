<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img"><title>Follow a run in the selected region</title><desc>Synthetic proposed observed-run dashboard. Actual actor/message/effect fields are shown for a selected claim region; these are design examples, not current live observations.</desc><rect width="100%" height="100%" fill="#f5f7f9"/>
