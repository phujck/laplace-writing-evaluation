<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img"><title>Understand a setting and its running version</title><desc>Proposed effective-settings inspector with per-key precedence, authority ceilings, origins and explicit future/run boundary.</desc><rect width="100%" height="100%" fill="#f5f7f9"/>
<text x="20" y="25" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700">DESIGN PROPOSAL · STATIC · SYNTHETIC EXAMPLE</text>
<text x="20" y="61" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700">Understand a setting and its running version</text>
<rect x="20" y="82" width="1240" height="52" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="32" y="108" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Example note / Workflow v5 / Draft / Writer / Settings</text>
<rect x="20" y="151" width="350" height="455" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="32" y="177" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Setting families</text>
<text x="38" y="217" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Purpose &amp; instructions</text>
<text x="38" y="260" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Model &amp; effort</text>
<text x="38" y="303" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Inputs &amp; outputs</text>
<text x="38" y="346" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Advance policy</text>
<text x="38" y="389" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Budget &amp; limits</text>
<text x="38" y="432" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Permissions</text>
<text x="38" y="475" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Review &amp; return</text>
<rect x="387" y="151" width="873" height="455" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="399" y="177" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Effective instruction · writer</text>
<text x="405" y="218" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400">Explain the selected argument for a new reader. Preserve evidence links and return reviewable</text>
<text x="405" y="242" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400">edits.</text>
<text x="405" y="302" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700">Origin and composition</text>
<text x="405" y="339" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Global fixed rules (not replaceable by local preference)</text>
<text x="405" y="377" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Project v3: explain premises before the result</text>
<text x="405" y="415" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Workflow v5 → Draft step: selected reader plan and evidence</text>
<text x="405" y="453" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Writer role: connected explanation → Object/task: section 2 intent</text>
<rect x="405" y="492" width="837" height="88" rx="7" fill="#fff3d6" stroke="#c2cbd3"/>
<text x="422" y="522" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Permission ceiling: propose edits to section 2. This instruction cannot grant repository writes or</text>
<text x="422" y="543" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">new recipients. Expanding authority is a separate authorised operation.</text>
<rect x="20" y="625" width="1240" height="100" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
<text x="32" y="651" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="700">Active run boundary</text>
<text x="40" y="681" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">Current Draft uses v4. This v5 change is not injected into the running provider.</text>
<text x="40" y="710" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">Wait, stop-before-next, or owner-supported replan. Cancellation preserves committed effects.</text>
<rect x="20" y="743" width="271" height="42" rx="7" fill="#225c9c" stroke="#225c9c"/>
<text x="32" y="767" fill="#ffffff" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Save for future runs</text>
<rect x="305" y="743" width="293" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="317" y="767" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Inspect running v4 basis</text>
<rect x="613" y="743" width="297" height="42" rx="7" fill="#ffffff" stroke="#225c9c"/>
<text x="625" y="767" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Request next safe boundary</text>
<text x="924" y="766" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">Unavailable actions explain their owner.</text>
</svg>
