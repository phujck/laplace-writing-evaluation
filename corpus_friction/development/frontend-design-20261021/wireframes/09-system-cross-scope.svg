<text x="38" y="920" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Document/source/reader objects → related system evidence. Current-edition Work remains review-required.</text>
<text x="38" y="953" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Document owns its source, reader plan and claims; system contracts remain linked evidence.</text>
