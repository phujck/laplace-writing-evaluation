<text x="62" y="1082" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">Evidence is organised by subject/version/action/review and responsible owner. Historical hashes/paths stay usable through custody references; campaign membership never grants</text>
<text x="62" y="1102" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">writes.</text>
<text x="20" y="1184" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700">Discovery at the right grade · same owner reads for human and agent</text>
<text x="20" y="1213" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">Only system entry + browser/workflow task + real scope. No project, Work id, evidence path or chat supplied.</text>
