<text x="62" y="1009" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">The named campaigns and Work are real legacy records. Cross-scope associations and general owner navigation are proposed design; no namespace, grant, project or evidence</text>
