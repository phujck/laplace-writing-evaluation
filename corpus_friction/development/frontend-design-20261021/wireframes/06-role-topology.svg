<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="875" viewBox="0 0 1280 875" role="img"><title>Edit the roles inside a workflow step</title><desc>Proposed central direct-manipulation role topology editor, with parallel checks, independent reviewer relation and effect scope. Definition and actual run remain distinct.</desc><rect width="100%" height="100%" fill="#f5f7f9"/>
