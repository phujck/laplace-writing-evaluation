<text x="56" y="493" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">Input: document only</text>
<text x="56" y="522" fill="#526474" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">Return: reader findings</text>
<rect x="482" y="359" width="332" height="118" rx="7" fill="#ffffff" stroke="#c2cbd3"/>
