<rect x="866" y="655" width="394" height="42" rx="7" fill="#225c9c" stroke="#225c9c"/>
<text x="878" y="679" fill="#ffffff" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700">Save role topology v5</text>
<rect x="20" y="719" width="1240" height="58" rx="7" fill="#edf4fc" stroke="#c2cbd3"/>
<text x="32" y="746" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700">1</text>
<text x="62" y="741" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">Stage → role assignment → acting session. Configure the role’s purpose, model, instructions and permissions directly; inspect inherited origins when needed.</text>
<rect x="20" y="789" width="1240" height="58" rx="7" fill="#edf4fc" stroke="#c2cbd3"/>
<text x="32" y="816" fill="#225c9c" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700">2</text>
<text x="62" y="811" fill="#1f2c3b" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400">Document-only admission is a proposed sealed input contract. The current standard review context is not silently relabelled blind.</text>
</svg>
