<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>conceptric · the eigen engine</title>
<!-- THE ONE PALETTE (visual §6.1 · L5): hymn.css is the sole color/type source; this
     surface declares NO color literal — every card/chip/door/echip/kbadge rides a hymn
     class/var. Realises the approved mock (mocks/conceptric.html, D1–D16) over the REAL
     /corpus/* data layer: the BOARD owns the centre (grade chips = server slices), the
     INSPECTOR stands in its own column (altitude + grounds + argues-in + doors). -->
<link rel="stylesheet" href="/shared/hymn.css">
<script defer src="/shared/shell.js"></script>
<style>
/* LAYOUT ONLY (visual §6.2, ≤4KB, zero color literals) — the page skeleton painted on
   first paint: the board column, the boardbar (grade strata + find), the inspector column.
   Every COMPONENT atom rendered once JS runs (cards, chips, doors, ancestry hops, the
   degraded fix, the ↑/↓ affordance labels, the rule capture) lives in conceptric-panes.mjs's
   COMPONENT_CSS, injected at init — so this island stays inside the per-surface budget. */
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
/* SCROLL LAW (P10 amended): body is the bounded viewport flex column (shell.js sets its
   padding-top to clear the fixed #hy-shell); the page never scrolls — the board scrolls
   inside its own pane. Every ancestor of #cx-board carries min-height:0 so overflow:auto
   engages instead of the column growing to fit all 49 g0 nodes. */
body{overflow:hidden;display:flex;flex-direction:column}
#cx{display:flex;flex-direction:column;flex:1;min-height:0}
#cx-body{display:flex;flex:1;min-height:0}
#cx-centre{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#cx-right{width:378px;flex:none;border-left:1px solid var(--edge);overflow:auto;background:var(--bg)}

/* THE BOARD BAR — the grade strip (server slices) + find-node + the honest degraded chip */
#cx-boardbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:11px 16px;border-bottom:1px solid var(--edge)}
.cx-strata{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cx-strata .cx-slabel{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);
  font-weight:700;margin-right:2px}
.cx-find{display:flex;align-items:center;gap:8px;flex:1 1 260px;min-width:200px;justify-content:flex-end}
#cx-find-in{flex:0 1 260px;min-width:150px;background:var(--panel);color:var(--ink);
  border:1px solid var(--edge);border-radius:7px;padding:6px 10px;font:inherit;font-size:12px}
#cx-find-in::placeholder{color:var(--dim)}
#cx-find-in:focus{outline:none;border-color:var(--accent)}

/* THE BOARD — owns the centre; the slice-identity token (the grade proof) + node CARDS */
#cx-board{flex:1;overflow:auto;padding:14px 16px}
.cx-sliceid{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:12px}
.cx-slicetok{font-family:var(--mono);font-size:10.5px;text-transform:none;letter-spacing:0;
  color:var(--ink2);background:var(--bg);border:1px solid var(--edge);border-radius:6px;padding:3px 8px}
.cx-col{display:flex;flex-direction:column;gap:9px;max-width:760px}
.cx-empty{color:var(--dim);font-size:12px;font-style:italic;padding:10px 2px}

/* 375px — single column; the board keeps the centre; the inspector becomes a slide-in */
@media (max-width:560px){
  #cx-body{flex-direction:column}
  #cx-right{position:fixed;top:var(--hy-shell-h);right:0;bottom:0;width:min(340px,90vw);
    z-index:4150;border-left:1px solid var(--edge2);transform:translateX(100%);transition:transform .2s ease}
  body.insp-open #cx-right{transform:translateX(0)}
  .cx-col{max-width:none}
}
</style>
</head>
<body>
<main id="cx">
  <div id="cx-body">
    <!-- THE BOARD owns the centre; its bar carries the grade slices + find + degraded chip -->
    <section id="cx-centre">
      <div id="cx-boardbar">
        <div class="cx-strata" id="cx-strata" data-cgroup="grade-strata"></div>
        <div class="cx-find" id="cx-find" data-cgroup="find">
          <input id="cx-find-in" placeholder="find node — instant, over the built index"
                 autocomplete="off" aria-label="find node">
        </div>
      </div>
      <div id="cx-board" data-cgroup="board"><div class="cx-empty">resolving the corpus…</div></div>
    </section>
    <!-- THE INSPECTOR — the standing right column (the .hy-ins idiom) -->
    <aside id="cx-right" data-cgroup="inspector"></aside>
  </div>
</main>
<script type="module">
// the ONLY inline script: bootstrap the shared pane module (all network rides
// store.fetchJSON inside it — no raw fetch escapes the model on this surface).
import { initConceptric } from "/shared/conceptric-panes.mjs";
initConceptric();
</script>
</body>
</html>
