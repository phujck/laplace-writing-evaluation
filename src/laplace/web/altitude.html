<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>altitude · the eigen engine</title>
<!-- shared hymn sheet + shell (graceful no-op if /shared/ absent); KaTeX rides
     window.renderMath, lazy-loaded by the shell -->
<link rel="stylesheet" href="/shared/hymn.css">
<style>
:root{
  --bg:#0a0e1a; --panel:#111827; --panel2:#18202f; --edge:#1f2734; --edge2:#2d3547;
  --ink:#e8e6e3; --ink2:#9ca3af; --dim:#6b7280;
  --accent:#c9a96e; --teal:#a89a7a; --warn:#b8894a; --bad:#c0392b; --ok:#8aa86a; --keystone:#7eb8da;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;
  font:13px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#alt{flex:1;min-height:0;display:flex;flex-direction:column}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
.ink2{color:var(--ink2)}

/* ── header: anchor + altitude ladder + trace controls ───────────────────── */
#alt-head{flex:none;border-bottom:1px solid var(--edge2);background:var(--panel2);
  padding:8px 14px;display:flex;flex-direction:column;gap:8px}
#alt-head .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#alt-title{font-weight:600;letter-spacing:.3px}
#alt-title b{color:var(--keystone)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border:1px solid var(--edge2);
  border-radius:999px;background:var(--panel);font-size:12px}
.chip.kind{color:var(--teal);border-color:#2a4a3e}
.btn{cursor:pointer;padding:3px 11px;border:1px solid var(--edge2);border-radius:6px;
  background:var(--panel);color:var(--ink);font-size:12px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:not-allowed;border-color:var(--edge)}
/* the altitude ladder — one navigation, four altitudes; the focused rung lit */
#ladder{display:flex;align-items:stretch;gap:0;border:1px solid var(--edge2);border-radius:8px;overflow:hidden}
#ladder .rung{padding:4px 12px;cursor:pointer;background:var(--panel);border-right:1px solid var(--edge);
  font-size:12px;display:flex;flex-direction:column;line-height:1.25;min-width:96px}
#ladder .rung:last-child{border-right:none}
#ladder .rung small{color:var(--dim);font-size:10px}
#ladder .rung.on{background:#1d2740;color:#cfe0ff}
#ladder .rung.anchor::after{content:"● anchor";color:var(--warn);font-size:9px;margin-top:1px}
#ladder .rung:hover:not(.on){background:var(--panel2)}

/* ── the wiring-back strip — every join key, concrete values ──────────────── */
#wiring{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:11px}
#wiring .wk{display:inline-flex;flex-direction:column;padding:2px 8px;border:1px solid var(--edge);
  border-radius:6px;background:var(--panel)}
#wiring .wk b{color:var(--ink2);font-size:9px;text-transform:uppercase;letter-spacing:.4px}
#wiring .wk span{font-family:var(--mono);color:var(--teal);max-width:220px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#wiring .arr{color:var(--dim);padding:0 2px}

/* ── body: the tower, skin on top → substrate at the floor ───────────────── */
#alt-body{flex:1;min-height:0;overflow-y:auto;padding:10px 14px 40px;display:flex;
  flex-direction:column;gap:10px}
.panel{border:1px solid var(--edge2);border-radius:10px;background:var(--panel);overflow:hidden}
.panel>h2{margin:0;padding:8px 12px;font-size:12px;font-weight:600;letter-spacing:.3px;
  display:flex;align-items:center;gap:10px;background:var(--panel2);border-bottom:1px solid var(--edge);
  cursor:pointer}
.panel>h2 .ix{font-family:var(--mono);color:var(--keystone);font-size:11px}
.panel>h2 .join{margin-left:auto;color:var(--dim);font-size:10px;font-weight:400;max-width:46%;
  text-align:right}
.panel.on{border-color:var(--accent)}
.panel.on>h2{background:#18223a}
.panel .body{padding:11px 13px;display:none}
.panel.on .body{display:block}
.panel.collapsed .body{display:none}

/* nodes */
.ncard{border:1px solid var(--edge);border-radius:8px;padding:8px 10px;margin:6px 0;background:var(--panel2);cursor:pointer}
.ncard:hover{border-color:var(--accent)}
.ncard .id{font-family:var(--mono);color:var(--accent);font-size:12px}
.ncard .meta{font-size:10px;color:var(--dim);margin-left:8px}
.ncard .ess{color:var(--ink2);font-size:12px;margin-top:3px}
.g{display:inline-block;min-width:20px;text-align:center;padding:0 5px;border-radius:5px;
  background:#22314a;color:#bcd2ff;font-family:var(--mono);font-size:11px}
.g.floor{background:#26382b;color:#bfe6c8}
.g.spine{background:#3a2d4a;color:#e0c9ff}
.nbh{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.nbh .col{flex:1;min-width:200px}
.nbh .col h4{margin:0 0 4px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim)}
.nbh .col .n{font-family:var(--mono);font-size:11px;padding:2px 0;color:var(--ink2)}

/* grade-shells */
#shells{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end}
.shell{cursor:pointer;border:1px solid var(--edge);border-radius:6px;padding:4px 6px;min-width:44px;
  text-align:center;background:var(--panel2)}
.shell:hover{border-color:var(--accent)}
.shell.has-anchor{border-color:var(--warn);background:#2a2418}
.shell.sel{outline:2px solid var(--accent)}
.shell .gl{font-family:var(--mono);font-size:12px;color:var(--keystone)}
.shell .ct{font-size:9px;color:var(--dim)}
.shell .an{font-size:9px;color:var(--warn)}
.shell.floor .gl{color:var(--ok)}
.shell.spine .gl{color:var(--keystone)}
#shell-detail{margin-top:10px;border-top:1px dashed var(--edge);padding-top:8px;display:none}
#shell-detail.on{display:block}
.mismatch{margin-top:10px;border:1px solid #5a4a2a;border-radius:8px;background:#211d14;padding:8px 10px}
.mismatch h4{margin:0 0 4px;color:var(--warn);font-size:11px}
.mismatch table{border-collapse:collapse;font-family:var(--mono);font-size:11px;margin-top:4px}
.mismatch td,.mismatch th{border:1px solid var(--edge);padding:2px 8px;text-align:left}

/* spine rail — an EVEN grid, equal-height cards (finding 5): a fixed column track keeps
   every beat the same width and, with align-items:stretch, the same height as its row, so a
   6-line beat never towers beside a 2-line one and the last row reads as a tidy partial, not
   a ragged orphan. The prose is clamped to four lines so a long narrative can't blow the row. */
#rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;align-items:stretch}
.beat{border:1px solid var(--edge);border-radius:7px;padding:6px 9px;min-width:0;background:var(--panel2)}
.beat.anchor{border-color:var(--warn);background:#241f14}
.beat .bo{font-family:var(--mono);font-size:10px;color:var(--dim)}
.beat .bid{font-family:var(--mono);font-size:11px;color:var(--accent);overflow-wrap:anywhere}
.beat .bn{font-size:11px;color:var(--ink2);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

/* plan / prose — materialized, stale-aware */
.stamp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.badge{padding:2px 9px;border-radius:999px;font-size:11px;border:1px solid var(--edge2)}
.badge.stale{background:#2a1a1a;border-color:#5a2a2a;color:var(--bad)}
.badge.fresh{background:#16261a;border-color:#2a4a2e;color:var(--ok)}
.badge.state{background:#1a2130;color:var(--ink2)}
.job{color:var(--ink2);font-size:12px;white-space:pre-wrap;max-height:140px;overflow-y:auto;
  border-left:2px solid var(--edge2);padding-left:10px;margin:6px 0}
.links{display:flex;gap:8px;margin-top:8px}

/* detail drawer */
/* SCROLL LAW (P10 amended): the detail drawer hides via opacity, NOT an off-canvas
   transform:translateX(100%). Parked off-screen, its non-fixed children (header, dbody)
   had boxes spilling to right:1976 at a 1536 viewport — a horizontal breach even under
   body{overflow:hidden}. The drawer now stays anchored at right:0 (fully inside the
   viewport at every width) and fades on opacity; closed it is transparent + click-through
   (pointer-events:none) yet still laid out, so the close assertion (a visible :not(.on))
   holds. Zero element spills the viewport at either width. */
#alt-detail{position:fixed;right:0;top:0;bottom:0;width:min(440px,92vw);background:var(--panel);
  border-left:1px solid var(--edge2);transition:opacity .15s;opacity:0;pointer-events:none;
  z-index:50;display:flex;flex-direction:column;box-shadow:-8px 0 24px #0008}
#alt-detail.on{opacity:1;pointer-events:auto}
#alt-detail header{padding:9px 12px;border-bottom:1px solid var(--edge);display:flex;
  align-items:center;gap:8px;background:var(--panel2)}
#alt-detail header .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:16px}
#alt-detail .dbody{padding:11px 13px;overflow-y:auto}
.deriv{border:1px solid var(--edge);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--panel2)}
.deriv .rule{color:var(--warn);font-size:11px;margin-bottom:5px}
.dep{font-family:var(--mono);font-size:11px;padding:2px 0;display:flex;gap:8px;align-items:center}
.dep.setter{color:var(--teal)}
.dep.setter::after{content:"◄ sets grade";color:var(--teal);font-size:9px}
#msg{padding:20px;color:var(--dim)}
kbd{font-family:var(--mono);background:var(--panel2);border:1px solid var(--edge);border-radius:4px;
  padding:0 5px;font-size:11px}
</style>
</head>
<body>
<div id="alt">
  <header id="alt-head">
    <div class="row">
      <div id="alt-title">altitude · <span id="h-corpus" class="dim"></span></div>
      <span id="h-anchor"></span>
      <div style="margin-left:auto;display:flex;gap:6px">
        <button class="btn" id="up" title="trace up — toward the prose skin">↑ trace up</button>
        <button class="btn" id="down" title="drill down — toward the node substrate">↓ drill down</button>
      </div>
    </div>
    <div class="row">
      <div id="ladder"></div>
      <span class="dim" style="font-size:11px">one substrate · four altitudes — click a rung, or <kbd>↑</kbd>/<kbd>↓</kbd></span>
    </div>
    <div class="row"><div id="wiring"></div></div>
  </header>
  <main id="alt-body"><div id="msg">loading…</div></main>
  <aside id="alt-detail">
    <header><span id="d-title" class="mono"></span><span class="x" id="d-close">×</span></header>
    <div class="dbody" id="d-body"></div>
  </aside>
</div>

<!-- the shared shell (nav + corpus picker + window.renderMath/KaTeX). Graceful
     no-op if /shared/ is absent — the tower still renders, math stays as $…$. -->
<script defer src="/shared/shell.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const qp = new URLSearchParams(location.search);
// the tower is addressed by ?corpus= (the production key) or, for a dir-based
// review that carries no corpus, ?dir= (reverse-resolved to the key server-side,
// F3). corpus wins when both are present; the bare default keeps a param-less
// open working.
const CORPUS = qp.get("corpus") || (qp.get("dir") ? "" : "subset-sum-itqde");
const DIR = qp.get("dir") || "";
const ANCHOR = qp.get("anchor") || "";
// altitude order for the ladder + shift buttons: index 0 = substrate (nodes),
// index 3 = the prose skin. "trace up" raises the altitude toward the skin.
const LADDER = ["nodes","grade_shells","spine","plan_prose"];
const LABEL = {nodes:"NODES", grade_shells:"GRADE-SHELLS", spine:"SPINE", plan_prose:"PLAN · PROSE"};
const SUB   = {nodes:"the substrate", grade_shells:"by dep_grade", spine:"the rail", plan_prose:"the skin (materialized)"};
let DATA=null, FOCUS="nodes";

function renderMath(el){ if(window.renderMath) window.renderMath(el); }

async function boot(){
  let r;
  const loc = CORPUS ? ("corpus="+encodeURIComponent(CORPUS))
                     : ("dir="+encodeURIComponent(DIR));
  try{ r = await fetch("/altitude/data?"+loc+"&anchor="+encodeURIComponent(ANCHOR)); }
  catch(e){ $("#msg").textContent="fetch failed: "+e; return; }
  if(!r.ok){ $("#msg").textContent="altitude "+r.status+": "+(await r.text()); return; }
  DATA = await r.json();
  FOCUS = DATA.open_at && LADDER.includes(DATA.open_at) ? DATA.open_at : "nodes";
  head(); ladder(); wiring(); body(); focusPanel(FOCUS);
}

function head(){
  $("#h-corpus").textContent = DATA.corpus;
  const a = DATA.anchor;
  $("#h-anchor").innerHTML = a.kind
    ? `<span class="chip">anchor <b class="mono">${esc(a.raw)}</b></span>`
       + `<span class="chip kind">${esc(a.kind)}</span>`
       + (a.section?`<span class="chip">§ ${esc(a.section)}</span>`:"")
    : `<span class="chip dim">no anchor — whole tower</span>`;
}

function ladder(){
  const anchorAlt = DATA.open_at;
  $("#ladder").innerHTML = LADDER.map((k,i)=>
    `<div class="rung${k===FOCUS?" on":""}${k===anchorAlt?" anchor":""}" data-k="${k}">`
    + `<span><small>alt ${i}</small> ${LABEL[k]}</span><small>${SUB[k]}</small></div>`).join("");
  $("#ladder").querySelectorAll(".rung").forEach(r=>
    r.onclick=()=>focusPanel(r.dataset.k));
}

function wiring(){
  const w = DATA.wiring_back;
  const cells = [
    ["pid / anchor", w.pid || DATA.anchor.raw || "—"],
    ["→ nodes", (w.pid_to_nodes.node_ids||[]).length + " ids"],
    ["→ grades", "dep_grade ×"+Object.keys(w.nodes_to_grades.grades||{}).length],
    ["→ beats", (w.grades_to_beats.beats||[]).join(", ") || "—"],
    ["→ section", w.beats_to_section.section || "—"],
    ["→ artefact", (w.section_to_artefact.tex||"—")+" · "+(w.section_to_artefact.pdf||"")],
  ];
  $("#wiring").innerHTML = cells.map((c,i)=>
    (i?`<span class="arr">→</span>`:"")
    + `<span class="wk" title="${esc(c[1])}"><b>${esc(c[0])}</b><span>${esc(c[1])}</span></span>`).join("");
}

function panelShell(k, inner, join){
  const i = LADDER.indexOf(k);
  return `<section class="panel" data-alt="${k}">`
    + `<h2 data-k="${k}"><span class="ix">alt ${i}</span> ${LABEL[k]}`
    + `<span class="join">${esc(join||"")}</span></h2>`
    + `<div class="body">${inner}</div></section>`;
}

function body(){
  const A = DATA.altitudes;
  // rendered skin-on-top → substrate-at-the-floor (the north star's tower)
  const html = [
    panelShell("plan_prose", planProse(A.plan_prose), A.plan_prose.join_down),
    panelShell("spine",       spinePanel(A.spine),     A.spine.join_down),
    panelShell("grade_shells",shellPanel(A.grade_shells), A.grade_shells.join_down),
    panelShell("nodes",       nodesPanel(A.nodes),     A.nodes.join_down),
  ].join("");
  $("#alt-body").innerHTML = html;
  $("#alt-body").querySelectorAll(".panel>h2").forEach(h=>
    h.onclick=()=>focusPanel(h.dataset.k));
  wireNodes();
  wireShells();
  renderMath($("#alt-body"));
}

/* ── altitude 0 · NODES ─────────────────────────────────────────────────── */
function nodesPanel(N){
  if(!N.nodes.length) return `<div class="dim">this anchor pins no projected nodes `
    + `(an intro / close section written last, or an empty selection). The plan section still resolves above.</div>`;
  let h = N.nodes.map(nodeCard).join("");
  if(N.neighborhood){
    const nb = N.neighborhood;
    const col = (title,arr)=>`<div class="col"><h4>${title} (${(arr||[]).length})</h4>`
      + (arr||[]).slice(0,12).map(x=>`<div class="n" data-node="${esc(x.id)}">${esc(x.id)} `
        + `<span class="g">${x.grade==null?"·":x.grade}</span></div>`).join("") + `</div>`;
    h += `<div class="nbh">`+col("derives from · below",nb.below)
       + col("consumed by · above",nb.above)+col("lateral · same grade",nb.lateral)+`</div>`;
  }
  return h;
}
function nodeCard(n){
  const gc = n.grade===0?"floor":(n.grade===DATA.g_max?"spine":"");
  return `<div class="ncard" data-node="${esc(n.id)}">`
    + `<span class="id">${esc(n.id)}</span>`
    + `<span class="g ${gc}">${n.grade==null?"·":n.grade}</span>`
    + `<span class="meta">${esc(n.kind||"")}${n.section_ref?" · beat "+esc(n.section_ref):""}</span>`
    + (n.essence?`<div class="ess">${esc(n.essence)}</div>`:"")+`</div>`;
}

/* ── altitude 1 · GRADE-SHELLS — grading made load-bearing ──────────────── */
function shellPanel(S){
  const shells = S.shells.map(sh=>{
    const cls = [sh.is_floor?"floor":"", sh.is_spine_tier?"spine":"",
                 sh.anchor_ids.length?"has-anchor":""].join(" ");
    return `<div class="shell ${cls}" data-g="${sh.grade}">`
      + `<div class="gl">${sh.grade}</div><div class="ct">${sh.global_count}</div>`
      + (sh.anchor_ids.length?`<div class="an">◆${sh.anchor_ids.length}</div>`:"")+`</div>`;
  }).join("");
  let mism = "";
  const gm = S.grade_mismatch;
  if(gm){
    const rows = (gm.rows||[]).slice(0,20).map(r=>
      `<tr><td>${esc(r.id)}</td><td>${r.stored}</td><td>${r.derived}</td></tr>`).join("");
    mism = `<div class="mismatch"><h4>stored ⟂ derived grade — ${gm.count} in this anchor`
      + `</h4>`
      + `<div class="dim" style="font-size:11px">${esc(gm.note)}</div>`
      + (rows?`<table><tr><th>node</th><th>stored</th><th>derived</th></tr>${rows}</table>`:"")
      + `</div>`;
  }
  return `<div class="dim" style="font-size:11px;margin-bottom:6px">shells = derivational grade `
    + `(<span class="g floor">0</span> atoms/postulates at the floor → `
    + `<span class="g spine">${S.g_max}</span> the spine at g_max). ◆ = the anchor's nodes. `
    + `Click a shell to see its nodes; click a node for its derivation.</div>`
    + `<div id="shells">${shells}</div><div id="shell-detail"></div>${mism}`;
}

/* ── altitude 2 · SPINE — reused from the storyboard rail ───────────────── */
function spinePanel(S){
  if(!S.rail.length) return `<div class="dim">no spine beats.</div>`;
  const beats = S.rail.map(b=>
    `<div class="beat${b.anchor?" anchor":""}" data-node="${esc(b.id)}">`
    + `<div class="bo">beat ${b.ord} · <span class="g spine">g${b.grade==null?"·":b.grade}</span></div>`
    + `<div class="bid">${esc(b.id)}</div>`
    + (b.term?`<div class="bn">${esc(b.term)}</div>`:(b.narrative?`<div class="bn">${esc(b.narrative)}</div>`:""))
    + `</div>`).join("");
  return `<div class="dim" style="font-size:11px;margin-bottom:6px">the conceptric spine rail `
    + `(reused from the storyboard). The anchor's beats are lit. `
    + `<a href="${esc(S.storyboard_link)}">open in storyboard →</a></div>`
    + `<div id="rail">${beats}</div>`;
}

/* ── altitude 3 · PLAN / PROSE — materialized, stale-aware ──────────────── */
function planProse(P){
  const s = P.section, art = P.artefact||{}, st = art.staleness||{};
  const stale = st.stale;
  let h = `<div class="stamp">`;
  if(art.compiled){
    h += `<span class="badge ${stale?"stale":"fresh"}">${stale?("▲ "+(st.n_newer||0)+" stale — rebuild to refresh"):"● in sync"}</span>`;
    if(art.state) h += `<span class="badge state">${esc(art.state)}</span>`;
    if(art.revision!=null) h += `<span class="dim">rev ${esc(art.revision)}</span>`;
    if(art.created) h += `<span class="dim">compiled ${esc(art.created)}</span>`;
  } else {
    h += `<span class="badge dim">not yet compiled</span>`;
  }
  h += `</div>`;
  h += `<div class="dim" style="font-size:11px">${esc(st.note||"the upper half is the slow LLM leg — a materialized projection, never a live re-flow.")}</div>`;
  if(st.newer_sources && st.newer_sources.length)
    h += `<div class="dim mono" style="font-size:10px;margin-top:3px">changed since compile: ${esc(st.newer_sources.join(", "))}</div>`;
  if(s){
    h += `<h3 style="margin:10px 0 2px;font-size:13px">§ ${esc(s.id)} — ${esc(s.title||"")}</h3>`;
    if(s.job) h += `<div class="job">${esc(s.job)}</div>`;
    if((s.nodes_in_order||[]).length)
      h += `<div class="dim" style="font-size:11px">nodes in order (${s.nodes_in_order.length}): `
        + s.nodes_in_order.slice(0,40).map(n=>`<span class="mono" data-node="${esc(n)}" style="cursor:pointer;color:var(--accent)">${esc(n)}</span>`).join(", ")
        + (s.nodes_in_order.length>40?" …":"")+`</div>`;
  } else {
    h += `<div class="dim">no owning plan section resolved for this anchor.</div>`;
  }
  // register/honesty fix (ACT5/job5): /projection and /review are retired doors (both
  // 301 -> /artefact, losing their file=/corpus= mapping on the hop) — naming them here
  // named a destination that no longer exists. The door now goes straight to /artefact,
  // carrying this panel's own selection (corpus + section, and the node anchor when one
  // is in view) instead of relying on the redirect to guess it.
  const artCorpus = DATA.corpus || CORPUS;
  const artQ = new URLSearchParams();
  if(artCorpus) artQ.set("corpus", artCorpus);
  if(s) artQ.set("section", s.id);
  if(DATA.anchor && DATA.anchor.kind) artQ.set("node", DATA.anchor.raw);
  const artHref = "/artefact?" + artQ.toString();
  const L = P.links||{};
  h += `<div class="links">`
    + `<a class="btn" href="${esc(artHref)}">open in /artefact →</a>`
    + `<a class="btn" href="${esc(L.storyboard)}">open /storyboard →</a></div>`;
  return h;
}

/* ── focus / trace-up / drill-down ──────────────────────────────────────── */
function focusPanel(k){
  if(!LADDER.includes(k)) return;
  FOCUS=k;
  $("#alt-body").querySelectorAll(".panel").forEach(p=>
    p.classList.toggle("on", p.dataset.alt===k));
  $("#ladder").querySelectorAll(".rung").forEach(r=>
    r.classList.toggle("on", r.dataset.k===k));
  const on = $(`.panel[data-alt="${k}"]`);
  if(on) on.scrollIntoView({behavior:"smooth", block:"nearest"});
  const i = LADDER.indexOf(k);
  $("#up").disabled = i>=LADDER.length-1;
  $("#down").disabled = i<=0;
}
$("#up").onclick   = ()=>focusPanel(LADDER[Math.min(LADDER.length-1, LADDER.indexOf(FOCUS)+1)]);
$("#down").onclick = ()=>focusPanel(LADDER[Math.max(0, LADDER.indexOf(FOCUS)-1)]);
window.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowUp"){ e.preventDefault(); $("#up").click(); }
  if(e.key==="ArrowDown"){ e.preventDefault(); $("#down").click(); }
  if(e.key==="Escape") closeDetail();
});

/* ── shell navigation: click a shell → its nodes ────────────────────────── */
function wireShells(){
  const S = DATA.altitudes.grade_shells;
  $("#alt-body").querySelectorAll(".shell").forEach(el=>{
    el.onclick=()=>{
      $("#alt-body").querySelectorAll(".shell").forEach(x=>x.classList.remove("sel"));
      el.classList.add("sel");
      const g = +el.dataset.g;
      const sh = S.shells.find(x=>x.grade===g);
      const det = $("#shell-detail"); det.classList.add("on");
      const anodes = (sh.anchor_nodes||[]).map(nodeCard).join("");
      const gsample = (sh.global_sample||[]).map(x=>
        `<span class="mono" data-node="${esc(x.id)}" style="cursor:pointer;color:var(--accent)">${esc(x.id)}</span>`).join(", ");
      det.innerHTML = `<div style="font-size:12px"><b>shell g=${g}</b> — `
        + `${sh.global_count} nodes corpus-wide${sh.anchor_ids.length?", ◆"+sh.anchor_ids.length+" in this anchor":""}</div>`
        + (anodes?`<div style="margin-top:6px"><span class="dim">anchor's nodes at this grade:</span>${anodes}</div>`:"")
        + `<div style="margin-top:6px" class="dim">shell members${sh.global_truncated?` (first ${(sh.global_sample||[]).length} of ${sh.global_count}, ${sh.global_truncated} more)`:""}: ${gsample||"—"}</div>`;
      wireNodes(); renderMath(det);
    };
  });
}

/* ── node click → the detail drawer: derivation + wiring-back ────────────── */
function wireNodes(){
  $("#alt-body").querySelectorAll("[data-node]").forEach(el=>{
    el.onclick=(ev)=>{ ev.stopPropagation(); openNode(el.dataset.node); };
  });
}
function openNode(id){
  const A = DATA.altitudes;
  const card = (A.nodes.nodes||[]).find(n=>n.id===id);
  const deriv = (A.grade_shells.derivation||{})[id];
  $("#d-title").textContent = id;
  let h = "";
  if(card){
    const gc = card.grade===0?"floor":(card.grade===DATA.g_max?"spine":"");
    h += `<div class="ncard"><span class="g ${gc}">${card.grade==null?"·":card.grade}</span> `
      + `<span class="meta">${esc(card.kind||"")}</span>`
      + (card.essence?`<div class="ess">${esc(card.essence)}</div>`:"")+`</div>`;
  }
  if(deriv){
    // the rule already reads "…= 1 + <max depth> = <grade>[; spine-elevated to g_max]"
    // so the arithmetic is visible; the elevation note restates the depth→g_max step.
    h += `<div class="deriv"><div class="rule">grade ${deriv.grade} — ${esc(deriv.rule)}`
      + (deriv.spine_elevated?` · <span style="color:var(--keystone)">spine-elevated (derivational depth ${deriv.dep_depth} → g_max ${deriv.grade})</span>`:"")+`</div>`;
    h += `<div class="dim" style="font-size:11px">stored grade ${deriv.stored_grade} · derived ${deriv.grade}`
      + (deriv.stored_grade!==deriv.grade?` <span style="color:var(--warn)">(divergent — stored is the vestigial containment default)</span>`:"")+`</div>`;
    if((deriv.deps||[]).length){
      const note = deriv.is_postulate
        ? "cited deps — a postulate's grade is 0 by declaration, so none of these set it:"
        : "derives from — the grade-setter (deepest CONTRIBUTED depth) is flagged; a spine-elevated dep contributes its depth not its grade, a cycle back-edge contributes 0 not its own depth:";
      h += `<div style="margin-top:5px" class="dim">${note}</div>`;
      h += deriv.deps.map(d=>`<div class="dep${d.is_grade_setter?" setter":""}" data-node="${esc(d.id)}" style="cursor:pointer">`
        + `<span class="g">${d.grade}</span> ${esc(d.id)}`
        + (d.cycle_broken
            ? ` <span class="dim" style="font-size:11px">· cycle back-edge: contributed ${d.contributed}, not its own depth ${d.dep_depth}</span>`
            : d.spine_elevated
              ? ` <span class="dim" style="font-size:11px">· spine-elevated: contributes depth ${d.contributed}, not grade ${d.grade}</span>`
              : ` <span class="dim" style="font-size:11px">· contributed ${d.contributed}</span>`)
        + `</div>`).join("");
    } else {
      h += `<div class="dim" style="margin-top:5px">dependency-free — derivational depth 0`
        + (deriv.spine_elevated?`, spine-elevated to g_max ${deriv.grade}`:`, sits at the floor`)+`.</div>`;
    }
    h += `</div>`;
  } else {
    h += `<div class="dim">no derivation record (node outside the anchor set — open its own altitude to derive it).</div>`;
  }
  // wiring-back for this node, concretely
  const w = DATA.wiring_back;
  h += `<div class="deriv"><div class="rule">wiring-back — this node's join keys</div>`
    + `<div class="dep"><b>grade</b> ${(w.nodes_to_grades.grades||{})[id]}</div>`
    + `<div class="dep"><b>beat</b> ${esc((card&&card.section_ref)||"—")}</div>`
    + `<div class="dep"><b>section</b> ${esc(w.beats_to_section.section||"—")}</div>`
    + `<div class="dep"><b>artefact</b> ${esc(w.section_to_artefact.tex||"—")}</div></div>`;
  $("#d-body").innerHTML = h;
  $("#d-body").querySelectorAll("[data-node]").forEach(el=>
    el.onclick=(ev)=>{ ev.stopPropagation(); openNode(el.dataset.node); });
  renderMath($("#d-body"));
  $("#alt-detail").classList.add("on");
}
function closeDetail(){ $("#alt-detail").classList.remove("on"); }
$("#d-close").onclick = closeDetail;

boot();
</script>
</body>
