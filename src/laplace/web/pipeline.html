<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research & writing · Eigen</title>
<!-- THE PROJECT SURFACE (W-PROJECT) — the pipeline joined to the one instrument. His
     ruling (2026-07-22): "I need the full pipeline information so I can understand exactly
     what is happening and see how interventions change it." The resting DOM is the composed
     BRIEF of where THIS project's pipeline stands (/pipeline/brief, rendered verbatim): the
     release state + growth rung in plain words, the last thing that ran and what it produced,
     the next action with its cost/PSU, and at most one decision. The cockpit strip + organ
     panels + generation story are the summonable board, materialised behind one open and
     pinned into the engine's focus geometry. hymn.css is the sole colour source; the
     focus/geometry runtime is engine.mjs; the surface logic is pipeline-panes.mjs; all
     network rides store.fetchJSON (the one gateway) — no raw fetch escapes the model. -->
<link rel="stylesheet" href="/shared/hymn.css">
<link rel="stylesheet" href="/shared/project-work.css">
<link rel="stylesheet" href="/shared/writing-pdf.css">
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/workspace.css">
<style>
/* LAYOUT ONLY (visual §6.2) — behaviour + component colours live in
   static_shared/pipeline-panes.mjs + hymn.css. No colour literals here. */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font:13px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--ink)}
body{overflow-x:hidden}
#pipe{max-width:none;margin:0;padding:0 0 90px}
/* wave 9: the frame's bar (workspace-frame.mjs) spans the window on every page; workspace pages set their own gutter */
@media(min-width:1400px){.pipe-top{max-width:1000px;margin-inline:auto}}
.pipe-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.pipe-top h1{font-size:17px;font-weight:600;letter-spacing:.3px;margin:0}
.pipe-top h1 b{color:var(--keystone)}
.pipe-sub{color:var(--ink2);font-size:12px}
#pipe-cur{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
.hy-card,.hy-chip,.hy-door{min-width:0}
.err{color:var(--bad)}
@media (max-width:640px){ #pipe{padding:0 0 64px} }
</style>
</head>
<body>
<!-- The resting altitude is the BRIEF; the cockpit strip + organ cards + dials + dry-run
     controls all ride static_shared/pipeline-panes.mjs, materialised behind one open and
     pinned into the engine's focus geometry (engine.mjs). Every fire-class control still
     renders its DRY-RUN + cost/PSU before any commitment (his P1 amendment: what-will-this-do
     stays visible before it fires). All network rides store.fetchJSON — no raw fetch. -->
<main id="pipe">
  <!-- the engine root: the brief is the resting altitude; the rail + focus are built on pin -->
  <section id="project-work" aria-label="Project goals and work"></section>
  <details id="pipeline-details" hidden><summary>Pipeline diagnostics and dispatch</summary>
    <span id="pipe-cur"></span><div id="eng-root"><div class="eng-brief"><p class="pipe-prose" data-role="brief-prose">Open to inspect the pipeline.</p></div></div>
  </details>
</main>

<script type="module">
// the ONLY inline script: bootstrap the pane module (all network rides store.fetchJSON
// inside it — no raw fetch escapes the model on this surface).
import { initPipeline } from "/shared/pipeline-panes.mjs";
import { initProjectWork } from "/shared/project-work.mjs";
initProjectWork();
document.querySelector('#pipeline-details').addEventListener('toggle', function(){if(this.open&&!this.dataset.loaded){this.dataset.loaded='true';initPipeline();}});
</script>
</body>
</html>
