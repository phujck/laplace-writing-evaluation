# ---------------------------------------------------------------------------
# Domains. Theory axioms + active project state, loaded by orient when relevant.
# ---------------------------------------------------------------------------
domains:
  engine:
    # the engine's OWN machinery - the conceptric->storyboard->projection
    # pipeline, its ledgers, gates, briefs, and operators. Added 2026-07-08 so
    # operational goals stop mis-routing to content domains (the infra mandate's
    # thread 3: "build section briefs" inferred domain:talks and surfaced voice
    # nodes). Tags are curated NARROW: no "manuscript", no "conceptric" alone -
    # content-domain goals must keep their homes (regression-guarded).
    axioms: domains/engine/axioms
    tags: [pipeline, ledger, ledgers, storyboard, brief, briefs, dispatch,
           gate, gates, verify, restructure, propagate, evolve, operator,
           operators, schema, markers, worklist, registry, infrastructure,
           machinery, freeze, transaction, rewire, plan-op, set-spine]
  synthetics:
    axioms: domains/synthetics/axioms
    tags: [synthetics, hierarchy]
    projects:
      adaptive_normal_form: domains/synthetics/projects/adaptive_normal_form
      the_phases_of_hierarchy: domains/synthetics/projects/the_phases_of_hierarchy
      operatorial_loss: domains/synthetics/projects/operatorial_loss
  web:
    axioms: domains/web/axioms
    tags: [web, website, jekyll, github-pages, site]
    projects:
      phujck_github_io: domains/web/projects/phujck_github_io
  talks:
    axioms: domains/talks/axioms
    tags: [talk, talks, slides, presentation, manuscript, projection]
    projects:
      talk_from_manuscript: domains/talks/projects/talk_from_manuscript
      explaining_eigen: domains/talks/projects/explaining_eigen

