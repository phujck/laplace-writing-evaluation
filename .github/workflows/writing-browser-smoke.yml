name: Writing browser server smoke

# Paid multi-platform acceptance is explicit; ordinary evidence/checkpoint pushes do not run CI.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/laplace/**'
      - 'atlas/src/**'
      - 'atlas/pyproject.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'deploy/writing/**'
      - 'profiles/**'
      - 'scripts/*writing*.py'
      - 'tests/test_writing*.py'
      - '.github/workflows/writing-browser-smoke.yml'

concurrency:
  group: writing-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-server:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            atlas/pyproject.toml
      - name: Install browser-server minimum
        run: python -m pip install ./atlas . pytest
      - name: Run portable owner and asset smoke
        run: python -m pytest -q tests/test_writing_portable.py tests/test_writing_portability.py tests/test_writing_container_package.py
      - name: Verify untouched example history and source closure
        if: ${{ hashFiles('release/export-manifest.json') != '' }}
        run: python scripts/verify_writing_evaluation.py --root .
      - name: Validate container configuration
        if: runner.os == 'Linux'
        env:
          LAPLACE_WORKSPACE: ${{ github.workspace }}
        run: docker compose -f deploy/writing/compose.yaml config --quiet
      - name: Verify installed UI assets outside checkout import path
        shell: bash
        run: |
          cd "$(mktemp -d)"
          python -c "from laplace import shared_ui; s=shared_ui.capture_asset_snapshot(); assert s.identity['assets'] >= 70 and s.identity['templates'] == 2; print(s.identity)"
