name: Publish and verify evaluation image
on:
  workflow_dispatch:
    inputs:
      release:
        description: Image release tag
        default: '2026-11-12'
        required: true
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free unused runner SDK space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release tag
        env:
          RELEASE: ${{ inputs.release }}
        run: '[[ "$RELEASE" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,100}$ ]]'
      - uses: docker/build-push-action@v6
        id: candidate
        with:
          context: .
          file: deploy/evaluation/Dockerfile
          platforms: linux/amd64
          load: true
          tags: laplace-writing-evaluation:candidate
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            RELEASE_VERSION=${{ inputs.release }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify candidate before publication
        run: python deploy/evaluation/verify_image.py --image laplace-writing-evaluation:candidate --output "$RUNNER_TEMP/candidate-verification"
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          file: deploy/evaluation/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/phujck/laplace-writing-evaluation:${{ inputs.release }}
            ghcr.io/phujck/laplace-writing-evaluation:latest
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            RELEASE_VERSION=${{ inputs.release }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - name: Verify published immutable image on new storage
        env:
          IMAGE: ghcr.io/phujck/laplace-writing-evaluation@${{ steps.publish.outputs.digest }}
        run: |
          python deploy/evaluation/verify_image.py --image "$IMAGE" --output "$RUNNER_TEMP/image-verification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-image-verification
          path: |
            ${{ runner.temp }}/candidate-verification
            ${{ runner.temp }}/image-verification
