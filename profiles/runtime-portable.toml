schema = "laplace-runtime-profiles/1"
project_python = ">=3.11"

[lifecycle]
python = ".venv/bin/python"
expected_python = "NOT_CONFIGURED"
launcher = "scripts/laplace-python"
override_env = "LAPLACE_PYTHON"
source_roots = ["src"]
user_site = false
virtual_environment = "explicit selection only"
install_policy = "Run scripts/configure_writing_runtime.py explicitly; startup installs nothing"

[browser_server]
entry = "python -m laplace.web.writing_server --root ."
state_policy = "explicit local checkout; no author-home fallback"

[publication]
schema = "laplace.publication-artifacts/1"
git_policy = "Source/configuration and necessary accepted serving state; no per-transition Git commits or disposable caches."
bootstrap = "Missing local caches require an explicit scripts/laplace-python scripts/reembed.py --full-metric; never a hidden startup rebuild."

[[publication.artifacts]]
key = "graded_tree"
path = ".self_graded.json"
required = true
role = "serving-state"
producer = "keeper.write_tree_local"
consumers = ["conceptric.load_network", "recursive_read"]
git_tracked = true
legacy_v1 = true
legacy_sidecars = true

[[publication.artifacts]]
key = "graded_index"
path = "SELF_GRADED_INDEX.md"
required = true
role = "projection"
producer = "keeper.write_skeleton"
consumers = ["coarse navigation"]
